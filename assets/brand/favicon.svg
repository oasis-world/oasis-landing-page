<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Oasis">
  <defs>
    <linearGradient id="gL" x1="5%" y1="10%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#ECFFB4"/>
      <stop offset="26%" stop-color="#98F94C"/>
      <stop offset="58%" stop-color="#3FDC3A"/>
      <stop offset="100%" stop-color="#0B9436"/>
    </linearGradient>
    <linearGradient id="gR" x1="95%" y1="8%" x2="20%" y2="95%">
      <stop offset="0%" stop-color="#F5FFCC"/>
      <stop offset="26%" stop-color="#AEFC5C"/>
      <stop offset="58%" stop-color="#48E642"/>
      <stop offset="100%" stop-color="#0EA23A"/>
    </linearGradient>
    <linearGradient id="shL" x1="30%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05401C" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="shR" x1="70%" y1="0%" x2="25%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.58"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#05401C" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="glL" cx="55%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#FFFFF2" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glR" cx="45%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#FFFFF6" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0A3D18" flood-opacity="0.32"/>
    </filter>

    <!-- two separate blades; air gap at top-center; bases meet only at bottom node -->
    <path id="L"
      d="M31 56
         C26 56 19 54 13 50
         C4 45 0.5 35 2 24
         C4 11 15 3 27 4.5
         C32 5.2 33 12 32 22
         C31 34 31 46 31 56Z"/>
    <path id="R"
      d="M33 56
         C38 56 45 54 51 50
         C60 45 63.5 35 62 24
         C60 11 49 3 37 4.5
         C32 5.2 31 12 32 22
         C33 34 33 46 33 56Z"/>
  </defs>

  <g filter="url(#ds)">
    <use href="#L" fill="url(#gL)"/>
    <use href="#L" fill="url(#shL)"/>
    <use href="#L" fill="url(#glL)"/>

    <use href="#R" fill="url(#gR)"/>
    <use href="#R" fill="url(#shR)"/>
    <use href="#R" fill="url(#glR)"/>
  </g>

  <use href="#L" fill="none" stroke="#0A7830" stroke-opacity="0.45" stroke-width="1.4"/>
  <use href="#R" fill="none" stroke="#0A7830" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- midribs -->
  <path d="M30.5 54C27 44 21 32 11 15" fill="none" stroke="#0A7830" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M33.5 54C37 44 43 32 53 15" fill="none" stroke="#0A7830" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round"/>

  <!-- veins -->
  <g fill="none" stroke="#0A7830" stroke-opacity="0.2" stroke-width="1.1" stroke-linecap="round">
    <path d="M26 48C16 44 7 37 4 30"/>
    <path d="M24 37C15 33 9 27 7 21"/>
    <path d="M38 48C48 44 57 37 60 30"/>
    <path d="M40 37C49 33 55 27 57 21"/>
  </g>

  <!-- gloss -->
  <path d="M5 18C14 8 28 6 33 16C25 12 14 14 7 22C3 21 3 19 5 18Z" fill="#FFFFFF" fill-opacity="0.74"/>
  <path d="M59 17C50 7 36 6 31 16C39 12 50 14 57 21C61 20 61 18 59 17Z" fill="#FFFFFF" fill-opacity="0.68"/>

  <!-- rim -->
  <path d="M3 24C4 12 14 3 26 4.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.52" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M61 24C60 12 50 3 38 4.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.8" stroke-linecap="round"/>

  <!-- bottom join (leaf bases only) -->
  <ellipse cx="32" cy="55.5" rx="4" ry="2.4" fill="#1CB442"/>
  <ellipse cx="30.8" cy="54.7" rx="1.3" ry="0.9" fill="#F4FFD0" opacity="0.88"/>
</svg>
